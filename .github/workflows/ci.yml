name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
        env:
          # Required for Vite env resolution during build. Real secrets come from
          # Vercel project env vars at deploy time — these are placeholders so
          # the build doesn't fail on undefined checks.
          APP_URL: https://manilawatch.com
          VITE_WHATSAPP_NUMBER: '639123456789'

  audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production dependencies only)
        # Report but do not fail the pipeline on transitive advisories.
        # Treat as an informational signal; triage weekly.
        run: npm audit --production --audit-level=high || true
